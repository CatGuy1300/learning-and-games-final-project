mode: "optuna"
optuna_sampler: "tpe"
num_trials: 150    # Increased trials because of more parameters
base_config: "configs/default_omwu.yaml"
sweep_name: "sweep_envelope_log_1"

search_space:
  cmaes.objective_type:
    type: "categorical"
    choices: ["envelope_trend_log"]
  cmaes.sigma:
    type: "float"
    low: 0.15
    high: 0.5
  cmaes.lambda_reg:
    type: "log_float"
    low: 0.1
    high: 5.0
  cmaes.T1_ratio:
    type: "float"
    low: 0.6
    high: 0.85
  cmaes.gamma_volatility:
    type: "float"
    low: 0.1       # Start lower
    high: 2.0      # Hard cap to prevent overriding regret
  execution.total_steps:
    type: "categorical"
    choices: [100000]
  cmaes.restarts:
    type: "categorical"
    choices: [0]
  cmaes.maxfevals:
    type: "categorical"
    choices: [4000]
